[project]
name = "agniai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic-settings>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.black]
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.nox
    | \.tox
    | \.venv
    | agniai-env
    | agniai-env-broken
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
skip = ["agniai-env", "agniai-env-broken", ".venv", "build", "dist"]
